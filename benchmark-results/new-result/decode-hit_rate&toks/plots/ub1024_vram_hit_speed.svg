<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="560" viewBox="0 0 1060 560">
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #1f2933; }
.title { font-size: 20px; font-weight: 700; }
.subtitle { font-size: 12px; fill: #52606d; }
.axis { stroke: #52606d; stroke-width: 1; }
.grid { stroke: #e4e7eb; stroke-width: 1; }
.tick { font-size: 11px; fill: #52606d; }
.label { font-size: 12px; fill: #323f4b; }
.legend { font-size: 12px; fill: #323f4b; }
.point-label { font-size: 10px; fill: #1f2933; }
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="34" class="title">ub=1024: VRAM cap, hit rate, and decode speed</text>
<text x="40" y="54" class="subtitle">Fixed pp=1024, tg=1024, predictor=lru, single GPU. Speed is calculated from decode ms/token.</text>
<text x="82" y="60" class="label" font-weight="700">Scaling with VRAM cap</text>
<line x1="82.0" y1="88" x2="82.0" y2="458" class="grid"/>
<text x="82.0" y="482" text-anchor="middle" class="tick">6G</text>
<line x1="301.0" y1="88" x2="301.0" y2="458" class="grid"/>
<text x="301.0" y="482" text-anchor="middle" class="tick">8G</text>
<line x1="520.0" y1="88" x2="520.0" y2="458" class="grid"/>
<text x="520.0" y="482" text-anchor="middle" class="tick">10G</text>
<line x1="82" y1="458.0" x2="520" y2="458.0" class="grid"/>
<text x="72" y="462.0" text-anchor="end" class="tick">92.4%</text>
<line x1="82" y1="365.5" x2="520" y2="365.5" class="grid"/>
<text x="72" y="369.5" text-anchor="end" class="tick">93.5%</text>
<line x1="82" y1="273.0" x2="520" y2="273.0" class="grid"/>
<text x="72" y="277.0" text-anchor="end" class="tick">94.7%</text>
<line x1="82" y1="180.5" x2="520" y2="180.5" class="grid"/>
<text x="72" y="184.5" text-anchor="end" class="tick">95.8%</text>
<line x1="82" y1="88.0" x2="520" y2="88.0" class="grid"/>
<text x="72" y="92.0" text-anchor="end" class="tick">96.9%</text>
<text x="530" y="462.0" text-anchor="start" class="tick">31</text>
<text x="530" y="369.5" text-anchor="start" class="tick">37</text>
<text x="530" y="277.0" text-anchor="start" class="tick">42</text>
<text x="530" y="184.5" text-anchor="start" class="tick">48</text>
<text x="530" y="92.0" text-anchor="start" class="tick">53</text>
<line x1="82" y1="458" x2="520" y2="458" class="axis"/>
<line x1="82" y1="458" x2="82" y2="88" class="axis"/>
<line x1="520" y1="458" x2="520" y2="88" class="axis"/>
<text x="301.0" y="522" text-anchor="middle" class="label">MoE cache VRAM cap</text>
<text x="22" y="273.0" text-anchor="middle" class="label" transform="rotate(-90 22 273.0)">decode hit rate</text>
<text x="576" y="273.0" text-anchor="middle" class="label" transform="rotate(90 576 273.0)">decode tok/s</text>
<polyline points="82.0,425.1 301.0,236.0 520.0,120.9" fill="none" stroke="#4c78a8" stroke-width="3"/>
<polyline points="82.0,424.4 301.0,132.5 520.0,121.6" fill="none" stroke="#e45756" stroke-width="3"/>
<circle cx="82.0" cy="425.1" r="5.5" fill="#4c78a8"/>
<text x="82.0" y="415.1" text-anchor="middle" class="point-label">92.8%</text>
<circle cx="82.0" cy="424.4" r="5.5" fill="#e45756"/>
<text x="82.0" y="444.4" text-anchor="middle" class="point-label">33.1</text>
<circle cx="301.0" cy="236.0" r="5.5" fill="#4c78a8"/>
<text x="301.0" y="226.0" text-anchor="middle" class="point-label">95.1%</text>
<circle cx="301.0" cy="132.5" r="5.5" fill="#e45756"/>
<text x="301.0" y="152.5" text-anchor="middle" class="point-label">50.5</text>
<circle cx="520.0" cy="120.9" r="5.5" fill="#4c78a8"/>
<text x="520.0" y="110.9" text-anchor="middle" class="point-label">96.5%</text>
<circle cx="520.0" cy="121.6" r="5.5" fill="#e45756"/>
<text x="520.0" y="141.6" text-anchor="middle" class="point-label">51.1</text>
<line x1="92" y1="110" x2="120" y2="110" stroke="#4c78a8" stroke-width="3"/>
<text x="128" y="114" class="legend">hit rate</text>
<line x1="212" y1="110" x2="240" y2="110" stroke="#e45756" stroke-width="3"/>
<text x="248" y="114" class="legend">decode tok/s</text>
<text x="670" y="60" class="label" font-weight="700">Hit rate to throughput</text>
<line x1="670.0" y1="88" x2="670.0" y2="458" class="grid"/>
<text x="670.0" y="482" text-anchor="middle" class="tick">92.4%</text>
<line x1="752.5" y1="88" x2="752.5" y2="458" class="grid"/>
<text x="752.5" y="482" text-anchor="middle" class="tick">93.5%</text>
<line x1="835.0" y1="88" x2="835.0" y2="458" class="grid"/>
<text x="835.0" y="482" text-anchor="middle" class="tick">94.7%</text>
<line x1="917.5" y1="88" x2="917.5" y2="458" class="grid"/>
<text x="917.5" y="482" text-anchor="middle" class="tick">95.8%</text>
<line x1="1000.0" y1="88" x2="1000.0" y2="458" class="grid"/>
<text x="1000.0" y="482" text-anchor="middle" class="tick">96.9%</text>
<line x1="670" y1="458.0" x2="1000" y2="458.0" class="grid"/>
<text x="660" y="462.0" text-anchor="end" class="tick">31</text>
<line x1="670" y1="365.5" x2="1000" y2="365.5" class="grid"/>
<text x="660" y="369.5" text-anchor="end" class="tick">37</text>
<line x1="670" y1="273.0" x2="1000" y2="273.0" class="grid"/>
<text x="660" y="277.0" text-anchor="end" class="tick">42</text>
<line x1="670" y1="180.5" x2="1000" y2="180.5" class="grid"/>
<text x="660" y="184.5" text-anchor="end" class="tick">48</text>
<line x1="670" y1="88.0" x2="1000" y2="88.0" class="grid"/>
<text x="660" y="92.0" text-anchor="end" class="tick">53</text>
<line x1="670" y1="458" x2="1000" y2="458" class="axis"/>
<line x1="670" y1="458" x2="670" y2="88" class="axis"/>
<text x="835.0" y="522" text-anchor="middle" class="label">decode cache hit rate</text>
<text x="616" y="273.0" text-anchor="middle" class="label" transform="rotate(-90 616 273.0)">decode tok/s</text>
<polyline points="699.3,424.4 868.0,132.5 970.7,121.6" fill="none" stroke="#111827" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="699.3" cy="424.4" r="7" fill="#4c78a8" stroke="#111827" stroke-width="0.8"/>
<text x="709.3" y="414.4" class="point-label">6G</text>
<circle cx="868.0" cy="132.5" r="7" fill="#f58518" stroke="#111827" stroke-width="0.8"/>
<text x="878.0" y="122.5" class="point-label">8G</text>
<circle cx="970.7" cy="121.6" r="7" fill="#54a24b" stroke="#111827" stroke-width="0.8"/>
<text x="980.7" y="111.6" class="point-label">10G</text>
<text x="670" y="516" class="subtitle">ub1024: 6G -> 8G gives the main speed jump; 8G -> 10G improves hit rate but speed saturates.</text>
</svg>
